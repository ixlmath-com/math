<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>char.js v6.0 - The Sandbox Update</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; user-select: none; }
        
        #ui { position: absolute; top: 10px; left: 10px; color: #00ffcc; z-index: 10; pointer-events: none; text-shadow: 1px 1px 0 #000; font-family: monospace; }
        #controls-hint { color: #aaa; font-size: 14px; margin-top: 5px; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: #fff; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; z-index: 10; mix-blend-mode: difference; }
        
        /* GMOD STYLE SPAWN MENU */
        #gmod-menu { position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; background: rgba(0, 0, 0, 0.85); z-index: 20; display: flex; border: 1px solid #444; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .hidden { display: none !important; }
        
        .menu-left { width: 250px; background: rgba(30, 30, 30, 0.9); border-right: 1px solid #444; padding: 20px; display: flex; flex-direction: column; }
        .menu-left h2 { margin: 0 0 20px 0; color: #fff; font-size: 20px; text-transform: uppercase; border-bottom: 2px solid #00ffcc; padding-bottom: 10px; }
        .category { padding: 10px; margin-bottom: 5px; background: #333; cursor: pointer; border-radius: 3px; font-weight: bold; color: #ccc; transition: 0.2s; }
        .category:hover, .category.active { background: #00ffcc; color: #000; }
        
        .menu-right { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; }
        .menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; }
        .menu-header h3 { margin: 0; color: #ccc; }
        
        #spawn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; overflow-y: auto; align-content: start; }
        
        .spawn-item { background: #222; border: 1px solid #555; height: 100px; display: flex; justify-content: center; align-items: center; flex-direction: column; cursor: pointer; border-radius: 5px; transition: 0.1s; text-align: center; padding: 10px; }
        .spawn-item:hover { border-color: #00ffcc; background: #2a2a2a; transform: scale(1.05); }
        .spawn-item.special { border-color: #a020f0; }
        .spawn-item.danger { border-color: #ff003c; color: #ff003c; font-weight: bold; }
        .spawn-item.tool { border-color: #ffa500; }
        
        .btn-resume { padding: 10px 20px; background: #00ffcc; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 3px; }
        .btn-resume:hover { background: #00ccaa; }

        #death-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 0, 0, 0.8); z-index: 100; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        #death-screen h1 { color: white; font-size: 80px; text-transform: uppercase; font-family: monospace; text-shadow: 4px 4px 0 #000; margin: 0; }
        #death-screen p { color: white; font-family: monospace; font-size: 20px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    
    <div id="ui">
        <h2>char.js v6.0</h2>
        <p>Tool: <span id="current-tool" style="color:white; font-weight: bold;">Gravity Gun</span></p>
        <div id="controls-hint">[Left Click] Grab / Throw &nbsp; | &nbsp; [Right Click] Drop</div>
        <p style="margin-top: 15px;">[WASD] Walk | [Q] Spawn Menu | [ESC] Pause</p>
    </div>
    
    <div id="crosshair"></div>

    <div id="gmod-menu" class="hidden">
        <div class="menu-left">
            <h2>Spawn Menu</h2>
            <div class="category active">Tools & Weapons</div>
            <div class="category">Entities</div>
            <div class="category">Anomalies</div>
            
            <div style="margin-top: auto;">
                <button id="btn-clear-world" style="width: 100%; padding: 10px; background: #ff003c; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 3px; margin-bottom: 10px;">Clear World</button>
                <p style="color: #666; font-size: 12px; margin: 0;">Click 'Resume Game' or press Q to exit</p>
            </div>
        </div>
        <div class="menu-right">
            <div class="menu-header">
                <h3 id="category-title">Tools & Weapons</h3>
                <button class="btn-resume" id="btn-resume">Resume Game</button>
            </div>
            <div id="spawn-grid"></div>
        </div>
    </div>

    <div id="death-screen" class="hidden">
        <h1>YOU DIED</h1>
        <p>The Hunter caught you.</p>
        <button class="btn-resume" style="margin-top: 20px;" id="btn-respawn">Respawn</button>
    </div>

    <script>
        // ====== GLOBAL VARIABLES ======
        let currentTool = 'gravitygun';
        let isPaused = true;
        let isDead = false;
        let heldBody = null; 
        
        // ====== MENU DATA (moved to top to avoid TDZ) ======
        const menuData = {
            "Tools & Weapons": [
                { id: "gravitygun", name: "Gravity Gun", class: "tool" },
                { id: "toolgun", name: "Tool Gun", class: "tool" }
            ],
            "Entities": [
                { id: "standard", name: "Standard Sphere", class: "" },
                { id: "bouncer", name: "Super Bouncer", class: "" },
                { id: "giant", name: "Giant Boulder", class: "" },
                { id: "ai_hunter", name: "The Hunter (AI)", class: "danger" }
            ],
            "Anomalies": [
                { id: "blackhole", name: "Black Hole", class: "special" },
                { id: "whitehole", name: "White Hole", class: "special" }
            ]
        };

        const gmodMenu = document.getElementById('gmod-menu');
        const spawnGrid = document.getElementById('spawn-grid');

        // ====== CLASSES ======
        document.addEventListener('contextmenu', e => e.preventDefault());

        class Anomaly {
            constructor(x, y, z, type) {
                this.pos = new THREE.Vector3(x, y, z);
                this.type = type; 
                this.force = (type === 'blackhole') ? 1500 : -2000; 
                this.mesh = null;
            }
        }

        class CharBody {
            constructor(x, y, z, radius, bounciness = 0.5, color = 0x00ffcc) {
                this.pos = new THREE.Vector3(x, y, z);
                this.oldPos = new THREE.Vector3(x, y, z);
                this.acc = new THREE.Vector3(0, 0, 0);
                this.radius = radius;
                this.bounciness = bounciness;
                this.friction = 0.99; 
                this.mesh = null; 
                this.isStatic = false; 
                this.isAI = false; 
            }

            update(dt) {
                if (this.isStatic) return; 
                let vel = new THREE.Vector3().subVectors(this.pos, this.oldPos);
                vel.multiplyScalar(this.friction);
                this.oldPos.copy(this.pos);
                let timeStepSq = dt * dt;
                let addedAcc = this.acc.clone().multiplyScalar(timeStepSq);
                this.pos.add(vel).add(addedAcc);
                this.acc.set(0, 0, 0);
            }

            applyForce(x, y, z) {
                if (this.isStatic) return;
                this.acc.x += x; this.acc.y += y; this.acc.z += z;
            }

            checkFloor(floorY) {
                if (this.isStatic) return;
                if (this.pos.y - this.radius < floorY) {
                    this.pos.y = floorY + this.radius;
                    let velY = this.pos.y - this.oldPos.y;
                    this.oldPos.y = this.pos.y + (velY * this.bounciness); 
                    
                    let velX = this.pos.x - this.oldPos.x;
                    let velZ = this.pos.z - this.oldPos.z;
                    this.oldPos.x = this.pos.x - (velX * 0.8);
                    this.oldPos.z = this.pos.z - (velZ * 0.8);
                }
            }
        }

        class AIEnemy extends CharBody {
            constructor(x, y, z) {
                super(x, y, z, 1.2, 0.2, 0xff0000);
                this.isAI = true;
                this.speed = 12; 
                this.friction = 0.90; 
            }

            huntPlayer(playerPos) {
                if (isDead) return;
                let dir = new THREE.Vector3().subVectors(playerPos, this.pos);
                let dist = dir.length();
                
                if (dist < this.radius + 1.5) {
                    killPlayer();
                    return;
                }

                dir.y = 0; 
                dir.normalize();
                this.applyForce(dir.x * this.speed * 100, 0, dir.z * this.speed * 100);
            }
        }

        class CharWorld {
            constructor() {
                this.bodies = [];
                this.anomalies = [];
                this.baseGravity = new THREE.Vector3(0, -30, 0);
            }

            addBody(body) { this.bodies.push(body); }

            removeBody(body) {
                scene.remove(body.mesh);
                this.bodies = this.bodies.filter(b => b !== body);
                if(heldBody === body) heldBody = null;
            }

            addAnomaly(anomaly) { this.anomalies.push(anomaly); }

            clear() {
                for(let i=0; i<this.bodies.length; i++) if(this.bodies[i].mesh) scene.remove(this.bodies[i].mesh);
                for(let i=0; i<this.anomalies.length; i++) if(this.anomalies[i].mesh) scene.remove(this.anomalies[i].mesh);
                this.bodies = []; this.anomalies = []; heldBody = null;
            }

            resolveCollisions() {
                for (let i = 0; i < this.bodies.length; i++) {
                    for (let j = i + 1; j < this.bodies.length; j++) {
                        let a = this.bodies[i]; let b = this.bodies[j];
                        let dx = a.pos.x - b.pos.x; let dy = a.pos.y - b.pos.y; let dz = a.pos.z - b.pos.z;
                        let distSq = dx*dx + dy*dy + dz*dz;
                        let minDist = a.radius + b.radius;
                        
                        if (distSq < minDist * minDist) {
                            let dist = Math.sqrt(distSq); if (dist === 0) continue; 
                            let overlap = minDist - dist;
                            let nx = dx / dist; let ny = dy / dist; let nz = dz / dist;
                            
                            let totalRadius = a.radius + b.radius;
                            let ratioA = b.radius / totalRadius; let ratioB = a.radius / totalRadius;
                            
                            if(a.isStatic) { ratioA = 0; ratioB = 1; }
                            if(b.isStatic) { ratioB = 0; ratioA = 1; }
                            if(a.isStatic && b.isStatic) { ratioA = 0; ratioB = 0; }
                            
                            a.pos.x += nx * overlap * ratioA; a.pos.y += ny * overlap * ratioA; a.pos.z += nz * overlap * ratioA;
                            b.pos.x -= nx * overlap * ratioB; b.pos.y -= ny * overlap * ratioB; b.pos.z -= nz * overlap * ratioB;
                        }
                    }
                }
                for (let i = this.bodies.length - 1; i >= 0; i--) {
                    let b = this.bodies[i];
                    for (let a = 0; a < this.anomalies.length; a++) {
                        if(this.anomalies[a].type === 'blackhole' && b.pos.distanceToSquared(this.anomalies[a].pos) < 4) {
                            this.removeBody(b); break;
                        }
                    }
                }
            }

            step(dt, playerPos) {
                for (let i = 0; i < this.bodies.length; i++) {
                    let b = this.bodies[i];
                    if(b.isStatic) continue;
                    
                    b.applyForce(this.baseGravity.x, this.baseGravity.y, this.baseGravity.z);
                    
                    if(b.isAI) {
                        b.huntPlayer(playerPos);
                    }

                    for (let a = 0; a < this.anomalies.length; a++) {
                        let anomaly = this.anomalies[a];
                        let dir = new THREE.Vector3().subVectors(anomaly.pos, b.pos);
                        let distanceSq = dir.lengthSq();
                        if(distanceSq < 1) distanceSq = 1; 
                        let forceMagnitude = anomaly.force / distanceSq;
                        dir.normalize();
                        b.applyForce(dir.x * forceMagnitude, dir.y * forceMagnitude, dir.z * forceMagnitude);
                    }
                }

                for (let i = 0; i < this.bodies.length; i++) this.bodies[i].update(dt);
                
                for(let i = 0; i < 3; i++) {
                    this.resolveCollisions();
                    for (let j = 0; j < this.bodies.length; j++) this.bodies[j].checkFloor(0); 
                }
                
                for (let i = 0; i < this.bodies.length; i++) {
                    if (this.bodies[i].mesh) this.bodies[i].mesh.position.copy(this.bodies[i].pos);
                }
            }
        }

        const physics = new CharWorld();
        let scene, camera, renderer, clock;
        let raycaster = new THREE.Raycaster();
        let centerPoint = new THREE.Vector2(0, 0); 
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

        // ====== FUNCTIONS ======
        function initGraphics() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            let ambientLight = new THREE.AmbientLight(0x606060); scene.add(ambientLight);
            let dirLight = new THREE.DirectionalLight(0xffffff, 1); dirLight.position.set(20, 50, 20); scene.add(dirLight);

            let gridTexture = new THREE.GridHelper(200, 100, 0x00ffcc, 0x222233);
            gridTexture.position.y = 0.01; scene.add(gridTexture);

            let floorGeo = new THREE.PlaneGeometry(200, 200);
            let floorMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            let floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.rotation.x = -Math.PI / 2; scene.add(floorMesh);

            clock = new THREE.Clock();
            setupMenuUI();
            setupInput();
        }

        function killPlayer() {
            if (isDead) return;
            isDead = true;
            isPaused = true;
            document.exitPointerLock();
            document.getElementById('death-screen').classList.remove('hidden');
        }

        function getRaycastHit() {
            raycaster.setFromCamera(centerPoint, camera);
            let intersects = raycaster.intersectObjects(scene.children);
            for (let i = 0; i < intersects.length; i++) {
                if (intersects[i].object.userData && intersects[i].object.userData.body) return intersects[i].object.userData.body;
            }
            return null;
        }

        function spawnCurrentTool() {
            let x = camera.position.x; let y = camera.position.y; let z = camera.position.z;
            let dir = new THREE.Vector3(); camera.getWorldDirection(dir);
            let spawnPos = new THREE.Vector3(x + (dir.x * 5), Math.max(2, y + (dir.y * 5)), z + (dir.z * 5));

            if(currentTool === 'blackhole' || currentTool === 'whitehole') {
                let anomaly = new Anomaly(spawnPos.x, spawnPos.y, spawnPos.z, currentTool);
                let geo = new THREE.SphereGeometry(1.5, 16, 16);
                let mat = new THREE.MeshBasicMaterial({ color: currentTool === 'blackhole' ? 0x000000 : 0xffffff, wireframe: true });
                let mesh = new THREE.Mesh(geo, mat);
                anomaly.mesh = mesh; mesh.position.copy(anomaly.pos); scene.add(mesh);
                physics.addAnomaly(anomaly);
                return;
            }

            if(currentTool === 'ai_hunter') {
                let body = new AIEnemy(spawnPos.x, spawnPos.y, spawnPos.z);
                let geo = new THREE.SphereGeometry(body.radius, 16, 16);
                let mat = new THREE.MeshLambertMaterial({ color: 0xff0000, emissive: 0x550000 });
                let mesh = new THREE.Mesh(geo, mat);
                mesh.userData.body = body; body.mesh = mesh; scene.add(mesh);
                physics.addBody(body);
                return;
            }

            let body;
            switch(currentTool) {
                case 'standard': body = new CharBody(spawnPos.x, spawnPos.y, spawnPos.z, 1.0, 0.5, Math.random() * 0xffffff); break;
                case 'bouncer': body = new CharBody(spawnPos.x, spawnPos.y, spawnPos.z, 0.8, 0.95, 0xff00ff); break;
                case 'giant': body = new CharBody(spawnPos.x, spawnPos.y, spawnPos.z, 3.0, 0.2, 0x555555); break;
            }

            if (body) {
                let geo = new THREE.SphereGeometry(body.radius, 16, 16);
                let mat = new THREE.MeshLambertMaterial({ color: body.color || 0x00ffcc });
                let mesh = new THREE.Mesh(geo, mat);
                mesh.userData.body = body; body.mesh = mesh; scene.add(mesh);
                body.oldPos.x -= dir.x * 0.6; body.oldPos.y -= dir.y * 0.6; body.oldPos.z -= dir.z * 0.6;
                physics.addBody(body);
            }
        }

        function renderCategory(catName) {
            document.getElementById('category-title').innerText = catName;
            spawnGrid.innerHTML = '';
            
            menuData[catName].forEach(item => {
                let div = document.createElement('div');
                div.className = `spawn-item ${item.class}`;
                div.innerText = item.name;
                div.onclick = () => {
                    currentTool = item.id;
                    heldBody = null; 
                    document.getElementById('current-tool').innerText = item.name;
                    
                    let hint = document.getElementById('controls-hint');
                    if(item.id === 'gravitygun') hint.innerHTML = "[Left Click] Grab / Throw &nbsp; | &nbsp; [Right Click] Drop";
                    else if(item.id === 'toolgun') hint.innerHTML = "[Left Click] Delete Entity &nbsp; | &nbsp; [Right Click] Freeze";
                    else hint.innerHTML = "[Left Click] Spawn Object";
                };
                spawnGrid.appendChild(div);
            });
        }

        function setupMenuUI() {
            const categories = document.querySelectorAll('.category');
            categories.forEach(cat => {
                cat.addEventListener('click', (e) => {
                    categories.forEach(c => c.classList.remove('active'));
                    cat.classList.add('active');
                    renderCategory(cat.innerText);
                });
            });
            renderCategory("Tools & Weapons");

            document.getElementById('btn-clear-world').addEventListener('click', () => { physics.clear(); });
            document.getElementById('btn-resume').addEventListener('click', () => { document.body.requestPointerLock(); });
            
            document.getElementById('btn-respawn').addEventListener('click', () => {
                isDead = false;
                physics.clear();
                camera.position.set(0, 5, 20);
                document.getElementById('death-screen').classList.add('hidden');
                document.body.requestPointerLock();
            });
        }

        function setupInput() {
            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    if (isDead) return;
                    isPaused = false; gmodMenu.classList.add('hidden');
                } else {
                    if (!isDead) {
                        isPaused = true; heldBody = null; 
                        gmodMenu.classList.remove('hidden');
                    }
                    moveForward = false; moveBackward = false; moveLeft = false; moveRight = false;
                }
            });

            document.addEventListener('keydown', (e) => {
                if (isDead) return;
                if (isPaused) {
                    if (e.code === 'KeyQ') document.body.requestPointerLock();
                    return; 
                }
                if (e.code === 'KeyW') moveForward = true; if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyA') moveLeft = true; if (e.code === 'KeyD') moveRight = true;
                if (e.code === 'KeyQ') document.exitPointerLock();
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false; if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyA') moveLeft = false; if (e.code === 'KeyD') moveRight = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPaused && !isDead) {
                    camera.rotation.y -= e.movementX * 0.002; camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                    camera.rotation.order = 'YXZ';
                }
            });
            
            document.addEventListener('mousedown', (e) => {
                if (isPaused || isDead) return;
                
                if (currentTool === 'gravitygun') {
                    if (e.button === 0) {
                        if (!heldBody) {
                            let hit = getRaycastHit();
                            if (hit && !hit.isAI) {
                                heldBody = hit; heldBody.isStatic = false;
                                heldBody.mesh.material.emissive.setHex(0x00ffcc);
                            }
                        } else {
                            let dir = new THREE.Vector3(); camera.getWorldDirection(dir);
                            heldBody.oldPos.copy(heldBody.pos).sub(dir.multiplyScalar(2.5)); 
                            heldBody.mesh.material.emissive.setHex(0x000000);
                            heldBody = null;
                        }
                    } else if (e.button === 2 && heldBody) {
                        heldBody.mesh.material.emissive.setHex(0x000000); heldBody = null;
                    }
                } 
                else if (currentTool === 'toolgun') {
                    let hit = getRaycastHit();
                    if (hit) {
                        if (e.button === 0) physics.removeBody(hit);
                        else if (e.button === 2 && !hit.isAI) {
                            hit.isStatic = !hit.isStatic;
                            if (hit.isStatic) { hit.acc.set(0,0,0); hit.oldPos.copy(hit.pos); hit.mesh.material.emissive.setHex(0x333333); } 
                            else hit.mesh.material.emissive.setHex(0x000000);
                        }
                    }
                } 
                else if (e.button === 0) spawnCurrentTool();
            });

            // NEW: Click on canvas to capture mouse when paused
            renderer.domElement.addEventListener('click', () => {
                if (isPaused && !isDead) {
                    document.body.requestPointerLock();
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!clock) return; // Prevent crash if clock isn't initialized
            let dt = clock.getDelta();
            
            if (!isPaused && !isDead) {
                let camRot = camera.rotation.y; let walkSpeed = 15 * dt;
                if (moveForward) { camera.position.z -= Math.cos(camRot) * walkSpeed; camera.position.x -= Math.sin(camRot) * walkSpeed; }
                if (moveBackward) { camera.position.z += Math.cos(camRot) * walkSpeed; camera.position.x += Math.sin(camRot) * walkSpeed; }
                if (moveLeft) { camera.position.x -= Math.cos(camRot + Math.PI/2) * walkSpeed; camera.position.z -= Math.sin(camRot + Math.PI/2) * walkSpeed; }
                if (moveRight) { camera.position.x += Math.cos(camRot + Math.PI/2) * walkSpeed; camera.position.z += Math.sin(camRot + Math.PI/2) * walkSpeed; }
                camera.position.y = 5; 

                if (heldBody) {
                    let dir = new THREE.Vector3(); camera.getWorldDirection(dir);
                    let targetPos = camera.position.clone().add(dir.multiplyScalar(8));
                    let pull = new THREE.Vector3().subVectors(targetPos, heldBody.pos);
                    heldBody.pos.add(pull.multiplyScalar(0.2)); 
                    heldBody.oldPos.copy(heldBody.pos);
                }

                for(let i=0; i<physics.anomalies.length; i++) {
                    physics.anomalies[i].mesh.rotation.y += 0.05; physics.anomalies[i].mesh.rotation.x += 0.02;
                }

                physics.step(1 / 60, camera.position);
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // ====== START ======
        initGraphics();
        animate();
    </script>
</body>
</html>
