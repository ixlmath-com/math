<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>char.js v5.0 - Gravity & Tool Guns</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; color: white; }
        
        #ui { position: absolute; top: 10px; left: 10px; color: #00ffcc; z-index: 10; pointer-events: none; text-shadow: 1px 1px 0 #000; }
        #controls-hint { color: #aaa; font-size: 14px; margin-top: 5px; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #00ffcc; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; z-index: 10; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 20; flex-direction: column; backdrop-filter: blur(4px); }
        .menu-box { background: #111; border: 2px solid #00ffcc; padding: 30px; border-radius: 8px; width: 450px; text-align: center; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
        .menu-box h1 { margin-top: 0; color: #00ffcc; text-transform: uppercase; letter-spacing: 2px; }
        
        .btn { background: transparent; color: #00ffcc; border: 2px solid #00ffcc; padding: 12px 20px; margin: 10px 0; font-family: monospace; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: all 0.2s; text-transform: uppercase; }
        .btn:hover { background: #00ffcc; color: #000; }
        .btn.danger { border-color: #ff003c; color: #ff003c; }
        .btn.danger:hover { background: #ff003c; color: #000; }
        .btn.special { border-color: #a020f0; color: #a020f0; }
        .btn.special:hover { background: #a020f0; color: #fff; }
        .btn.tool { border-color: #ffa500; color: #ffa500; }
        .btn.tool:hover { background: #ffa500; color: #000; }
        
        .grid-header { margin-top: 20px; font-weight: bold; color: #555; text-align: left; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; }
        #spawn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    
    <div id="ui">
        <h2>char.js v5.0</h2>
        <p>Tool: <span id="current-tool" style="color:white; font-weight: bold;">Standard Sphere</span></p>
        <div id="controls-hint">[Left Click] Spawn Object</div>
        <p style="margin-top: 15px;">[WASD] Walk | [Q] Spawn Menu | [ESC] Pause</p>
        <p>Entities: <span id="count">0</span> | Anomalies: <span id="anomaly-count">0</span></p>
    </div>
    
    <!-- Crosshair -->
    <div id="crosshair"></div>

    <!-- MAIN MENU -->
    <div id="main-menu" class="overlay">
        <div class="menu-box">
            <h1>System Paused</h1>
            <button class="btn" id="btn-resume">Resume Game</button>
            <button class="btn" id="btn-open-spawn">Open Spawn Menu (Q)</button>
            <button class="btn danger" id="btn-clear">Clear World</button>
        </div>
    </div>

    <!-- SPAWN MENU -->
    <div id="spawn-menu" class="overlay hidden">
        <div class="menu-box">
            <h1>Spawn Menu</h1>
            
            <div class="grid-header">Utilities</div>
            <div id="spawn-grid">
                <button class="btn spawn-btn tool" data-type="gravitygun">Gravity Gun</button>
                <button class="btn spawn-btn tool" data-type="toolgun">Tool Gun</button>
            </div>

            <div class="grid-header">Entities</div>
            <div id="spawn-grid">
                <button class="btn spawn-btn" data-type="standard">Standard Sphere</button>
                <button class="btn spawn-btn" data-type="bouncer">Super Bouncer</button>
                <button class="btn spawn-btn" data-type="giant">Giant Boulder</button>
                <button class="btn spawn-btn" data-type="swarm">Tiny Swarm</button>
            </div>

            <div class="grid-header">Anomalies</div>
            <div id="spawn-grid">
                <button class="btn spawn-btn special" data-type="blackhole">Black Hole</button>
                <button class="btn spawn-btn special" data-type="whitehole">White Hole</button>
            </div>

            <button class="btn danger" id="btn-close-spawn" style="margin-top: 20px;">Cancel</button>
        </div>
    </div>

    <script>
        let currentTool = 'standard';
        let isPaused = true;
        let heldBody = null; // Used for Gravity Gun
        
        // Disable Right-Click menu globally so we can use it for tools
        document.addEventListener('contextmenu', e => e.preventDefault());

        // ==========================================
        // 1. ENGINE CLASSES
        // ==========================================
        class Anomaly {
            constructor(x, y, z, type) {
                this.pos = new THREE.Vector3(x, y, z);
                this.type = type; 
                this.force = (type === 'blackhole') ? 1500 : -2000; 
                this.mesh = null;
            }
        }

        class CharBody {
            constructor(x, y, z, radius, bounciness = 0.5, color = 0x00ffcc) {
                this.pos = new THREE.Vector3(x, y, z);
                this.oldPos = new THREE.Vector3(x, y, z);
                this.acc = new THREE.Vector3(0, 0, 0);
                this.radius = radius;
                this.bounciness = bounciness;
                this.friction = 0.99; 
                this.mesh = null; 
                this.isStatic = false; // NEW: Allows freezing objects
            }

            update(dt) {
                if (this.isStatic) return; // Frozen objects ignore math
                let vel = new THREE.Vector3().subVectors(this.pos, this.oldPos);
                vel.multiplyScalar(this.friction);
                this.oldPos.copy(this.pos);
                let timeStepSq = dt * dt;
                let addedAcc = this.acc.clone().multiplyScalar(timeStepSq);
                this.pos.add(vel).add(addedAcc);
                this.acc.set(0, 0, 0);
            }

            applyForce(x, y, z) {
                if (this.isStatic) return;
                this.acc.x += x; this.acc.y += y; this.acc.z += z;
            }

            checkFloor(floorY) {
                if (this.isStatic) return;
                if (this.pos.y - this.radius < floorY) {
                    this.pos.y = floorY + this.radius;
                    let velY = this.pos.y - this.oldPos.y;
                    this.oldPos.y = this.pos.y + (velY * this.bounciness); 
                    
                    let velX = this.pos.x - this.oldPos.x;
                    let velZ = this.pos.z - this.oldPos.z;
                    this.oldPos.x = this.pos.x - (velX * 0.8);
                    this.oldPos.z = this.pos.z - (velZ * 0.8);
                }
            }
        }

        class CharWorld {
            constructor() {
                this.bodies = [];
                this.anomalies = [];
                this.baseGravity = new THREE.Vector3(0, -30, 0);
            }

            addBody(body) {
                this.bodies.push(body);
                document.getElementById('count').innerText = this.bodies.length;
            }

            removeBody(body) {
                scene.remove(body.mesh);
                this.bodies = this.bodies.filter(b => b !== body);
                document.getElementById('count').innerText = this.bodies.length;
                if(heldBody === body) heldBody = null;
            }

            addAnomaly(anomaly) {
                this.anomalies.push(anomaly);
                document.getElementById('anomaly-count').innerText = this.anomalies.length;
            }

            clear() {
                for(let i=0; i<this.bodies.length; i++) if(this.bodies[i].mesh) scene.remove(this.bodies[i].mesh);
                for(let i=0; i<this.anomalies.length; i++) if(this.anomalies[i].mesh) scene.remove(this.anomalies[i].mesh);
                this.bodies = [];
                this.anomalies = [];
                heldBody = null;
                document.getElementById('count').innerText = 0;
                document.getElementById('anomaly-count').innerText = 0;
            }

            resolveCollisions() {
                for (let i = 0; i < this.bodies.length; i++) {
                    for (let j = i + 1; j < this.bodies.length; j++) {
                        let a = this.bodies[i]; let b = this.bodies[j];
                        let dx = a.pos.x - b.pos.x; let dy = a.pos.y - b.pos.y; let dz = a.pos.z - b.pos.z;
                        let distSq = dx*dx + dy*dy + dz*dz;
                        let minDist = a.radius + b.radius;
                        
                        if (distSq < minDist * minDist) {
                            let dist = Math.sqrt(distSq);
                            if (dist === 0) continue; 
                            
                            let overlap = minDist - dist;
                            let nx = dx / dist; let ny = dy / dist; let nz = dz / dist;
                            
                            let totalRadius = a.radius + b.radius;
                            let ratioA = b.radius / totalRadius; 
                            let ratioB = a.radius / totalRadius;
                            
                            // If an object is frozen, the other object takes 100% of the push force
                            if(a.isStatic) { ratioA = 0; ratioB = 1; }
                            if(b.isStatic) { ratioB = 0; ratioA = 1; }
                            if(a.isStatic && b.isStatic) { ratioA = 0; ratioB = 0; }
                            
                            a.pos.x += nx * overlap * ratioA; a.pos.y += ny * overlap * ratioA; a.pos.z += nz * overlap * ratioA;
                            b.pos.x -= nx * overlap * ratioB; b.pos.y -= ny * overlap * ratioB; b.pos.z -= nz * overlap * ratioB;
                        }
                    }
                }
                
                // Black hole destruction logic
                for (let i = this.bodies.length - 1; i >= 0; i--) {
                    let b = this.bodies[i];
                    for (let a = 0; a < this.anomalies.length; a++) {
                        if(this.anomalies[a].type === 'blackhole' && b.pos.distanceToSquared(this.anomalies[a].pos) < 4) {
                            this.removeBody(b);
                            break;
                        }
                    }
                }
            }

            applyForces() {
                for (let i = 0; i < this.bodies.length; i++) {
                    let b = this.bodies[i];
                    if(b.isStatic) continue;
                    b.applyForce(this.baseGravity.x, this.baseGravity.y, this.baseGravity.z);
                    for (let a = 0; a < this.anomalies.length; a++) {
                        let anomaly = this.anomalies[a];
                        let dir = new THREE.Vector3().subVectors(anomaly.pos, b.pos);
                        let distanceSq = dir.lengthSq();
                        if(distanceSq < 1) distanceSq = 1; 
                        let forceMagnitude = anomaly.force / distanceSq;
                        dir.normalize();
                        b.applyForce(dir.x * forceMagnitude, dir.y * forceMagnitude, dir.z * forceMagnitude);
                    }
                }
            }

            step(dt) {
                this.applyForces();
                for (let i = 0; i < this.bodies.length; i++) this.bodies[i].update(dt);
                for(let i = 0; i < 3; i++) {
                    this.resolveCollisions();
                    for (let j = 0; j < this.bodies.length; j++) this.bodies[j].checkFloor(0); 
                }
                for (let i = 0; i < this.bodies.length; i++) {
                    let b = this.bodies[i];
                    if (b.mesh) b.mesh.position.copy(b.pos);
                }
            }
        }

        const physics = new CharWorld();

        // ==========================================
        // 2. THREE.JS & RAYCASTING
        // ==========================================
        let scene, camera, renderer, clock;
        let raycaster = new THREE.Raycaster();
        let centerPoint = new THREE.Vector2(0, 0); // Always cast from center of screen
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

        initGraphics();
        animate();

        function initGraphics() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            let ambientLight = new THREE.AmbientLight(0x606060);
            scene.add(ambientLight);
            let dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(20, 50, 20);
            scene.add(dirLight);

            let gridTexture = new THREE.GridHelper(200, 100, 0x00ffcc, 0x222233);
            gridTexture.position.y = 0.01;
            scene.add(gridTexture);

            let floorGeo = new THREE.PlaneGeometry(200, 200);
            let floorMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            let floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.rotation.x = -Math.PI / 2;
            scene.add(floorMesh);

            clock = new THREE.Clock();
            setupInput();
        }

        function getRaycastHit() {
            raycaster.setFromCamera(centerPoint, camera);
            let intersects = raycaster.intersectObjects(scene.children);
            for (let i = 0; i < intersects.length; i++) {
                let mesh = intersects[i].object;
                // Only return if it's a physics body (ignoring floor/grid)
                if (mesh.userData && mesh.userData.body) return mesh.userData.body;
            }
            return null;
        }

        function createEntity(x, y, z, radius, bounciness, color, speedMultiplier) {
            let body = new CharBody(x, y, z, radius, bounciness, color);
            let geo = new THREE.SphereGeometry(radius, 16, 16);
            let mat = new THREE.MeshLambertMaterial({ color: color });
            let mesh = new THREE.Mesh(geo, mat);
            
            // CRITICAL: Attach the physics body to the mesh so the Raycaster can find it!
            mesh.userData.body = body;
            body.mesh = mesh;
            scene.add(mesh);
            
            let dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            body.oldPos.x -= dir.x * speedMultiplier;
            body.oldPos.y -= dir.y * speedMultiplier;
            body.oldPos.z -= dir.z * speedMultiplier;

            physics.addBody(body);
        }

        function spawnCurrentTool() {
            let x = camera.position.x; let y = camera.position.y; let z = camera.position.z;
            
            if(currentTool === 'blackhole' || currentTool === 'whitehole') {
                let dir = new THREE.Vector3(); camera.getWorldDirection(dir);
                let tY = Math.max(2, y + (dir.y * 15));
                let anomaly = new Anomaly(x + (dir.x * 15), tY, z + (dir.z * 15), currentTool);
                let geo = new THREE.SphereGeometry(1.5, 16, 16);
                let mat = new THREE.MeshBasicMaterial({ color: currentTool === 'blackhole' ? 0x000000 : 0xffffff, wireframe: true });
                let mesh = new THREE.Mesh(geo, mat);
                anomaly.mesh = mesh; mesh.position.copy(anomaly.pos); scene.add(mesh);
                physics.addAnomaly(anomaly);
                return;
            }

            switch(currentTool) {
                case 'standard': createEntity(x, y, z, 1.0, 0.5, Math.random() * 0xffffff, 0.6); break;
                case 'bouncer': createEntity(x, y, z, 0.8, 0.95, 0xff00ff, 1.2); break;
                case 'giant': createEntity(x, y, z, 3.0, 0.2, 0x555555, 0.3); break;
                case 'swarm':
                    for(let i=0; i<5; i++) createEntity(x + (Math.random()-0.5), y + (Math.random()-0.5), z, 0.4, 0.6, 0xffff00, 0.8);
                    break;
            }
        }

        function updateHUD(toolName) {
            document.getElementById('current-tool').innerText = toolName;
            const hint = document.getElementById('controls-hint');
            if(toolName === 'Gravity Gun') hint.innerHTML = "[Left Click] Grab / Throw &nbsp; | &nbsp; [Right Click] Drop";
            else if(toolName === 'Tool Gun') hint.innerHTML = "[Left Click] Delete Entity &nbsp; | &nbsp; [Right Click] Freeze / Unfreeze";
            else hint.innerHTML = "[Left Click] Spawn Object";
        }

        // ==========================================
        // 3. INPUT MANAGEMENT
        // ==========================================
        const mainMenu = document.getElementById('main-menu');
        const spawnMenu = document.getElementById('spawn-menu');

        function setupInput() {
            document.getElementById('btn-resume').addEventListener('click', () => document.body.requestPointerLock());
            document.getElementById('btn-clear').addEventListener('click', () => { physics.clear(); document.body.requestPointerLock(); });
            document.getElementById('btn-open-spawn').addEventListener('click', () => { mainMenu.classList.add('hidden'); spawnMenu.classList.remove('hidden'); });
            document.getElementById('btn-close-spawn').addEventListener('click', () => document.body.requestPointerLock());

            document.querySelectorAll('.spawn-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentTool = e.target.getAttribute('data-type');
                    heldBody = null; // Drop anything we were holding
                    updateHUD(e.target.innerText);
                    document.body.requestPointerLock();
                });
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isPaused = false; mainMenu.classList.add('hidden'); spawnMenu.classList.add('hidden');
                } else {
                    isPaused = true; heldBody = null; // Drop object on pause
                    if(spawnMenu.classList.contains('hidden')) mainMenu.classList.remove('hidden');
                    moveForward = false; moveBackward = false; moveLeft = false; moveRight = false;
                }
            });

            document.addEventListener('keydown', (e) => {
                if (isPaused) return; 
                if (e.code === 'KeyW') moveForward = true; if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyA') moveLeft = true; if (e.code === 'KeyD') moveRight = true;
                if (e.code === 'KeyQ') { spawnMenu.classList.remove('hidden'); document.exitPointerLock(); }
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false; if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyA') moveLeft = false; if (e.code === 'KeyD') moveRight = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPaused) {
                    camera.rotation.y -= e.movementX * 0.002; camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                    camera.rotation.order = 'YXZ';
                }
            });
            
            // --- THE NEW TOOLS LOGIC ---
            document.addEventListener('mousedown', (e) => {
                if (isPaused) return;
                
                if (currentTool === 'gravitygun') {
                    if (e.button === 0) { // Left Click
                        if (!heldBody) {
                            // Pick Up
                            let hit = getRaycastHit();
                            if (hit) {
                                heldBody = hit;
                                heldBody.isStatic = false; // Unfreeze if it was frozen
                                heldBody.mesh.material.emissive.setHex(0x00ffcc); // Glow while holding
                            }
                        } else {
                            // Throw!
                            let dir = new THREE.Vector3();
                            camera.getWorldDirection(dir);
                            // Set oldPos backwards to simulate massive forward velocity
                            heldBody.oldPos.copy(heldBody.pos).sub(dir.multiplyScalar(2.5)); 
                            heldBody.mesh.material.emissive.setHex(0x000000); // Remove glow
                            heldBody = null;
                        }
                    } else if (e.button === 2) { // Right Click
                        // Drop gently
                        if (heldBody) {
                            heldBody.mesh.material.emissive.setHex(0x000000);
                            heldBody = null;
                        }
                    }
                } 
                else if (currentTool === 'toolgun') {
                    let hit = getRaycastHit();
                    if (hit) {
                        if (e.button === 0) { // Left Click: Delete
                            physics.removeBody(hit);
                        } else if (e.button === 2) { // Right Click: Freeze Toggle
                            hit.isStatic = !hit.isStatic;
                            if (hit.isStatic) {
                                // Kill all momentum when frozen
                                hit.acc.set(0,0,0);
                                hit.oldPos.copy(hit.pos);
                                hit.mesh.material.emissive.setHex(0x333333); // Dim grey glow
                            } else {
                                hit.mesh.material.emissive.setHex(0x000000);
                            }
                        }
                    }
                } 
                else {
                    // Normal object spawning (Left click only)
                    if (e.button === 0) spawnCurrentTool();
                }
            });
        }

        // ==========================================
        // 4. THE LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            let dt = clock.getDelta();
            
            if (!isPaused) {
                let camRot = camera.rotation.y; let walkSpeed = 15 * dt;
                if (moveForward) { camera.position.z -= Math.cos(camRot) * walkSpeed; camera.position.x -= Math.sin(camRot) * walkSpeed; }
                if (moveBackward) { camera.position.z += Math.cos(camRot) * walkSpeed; camera.position.x += Math.sin(camRot) * walkSpeed; }
                if (moveLeft) { camera.position.x -= Math.cos(camRot + Math.PI/2) * walkSpeed; camera.position.z -= Math.sin(camRot + Math.PI/2) * walkSpeed; }
                if (moveRight) { camera.position.x += Math.cos(camRot + Math.PI/2) * walkSpeed; camera.position.z += Math.sin(camRot + Math.PI/2) * walkSpeed; }
                camera.position.y = 5; 

                // -- GRAVITY GUN HOLDING MATH --
                if (heldBody) {
                    let dir = new THREE.Vector3();
                    camera.getWorldDirection(dir);
                    // Calculate a target point 8 units in front of the camera
                    let targetPos = camera.position.clone().add(dir.multiplyScalar(8));
                    
                    // Create an elastic pull toward that point
                    let pull = new THREE.Vector3().subVectors(targetPos, heldBody.pos);
                    heldBody.pos.add(pull.multiplyScalar(0.2)); 
                    
                    // Constantly reset oldPos so the object doesn't build up extreme momentum while we drag it around
                    heldBody.oldPos.copy(heldBody.pos);
                }

                for(let i=0; i<physics.anomalies.length; i++) {
                    physics.anomalies[i].mesh.rotation.y += 0.05; physics.anomalies[i].mesh.rotation.x += 0.02;
                }

                physics.step(1 / 60);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
